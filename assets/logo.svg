<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="LuxSea Miami">
  <title>LuxSea Miami</title>
  <defs>
    <clipPath id="lx-h2"><rect x="0" y="0" width="96" height="55"/></clipPath>
  </defs>
  <g transform="translate(0,10)">
    <circle cx="38" cy="32" r="19" fill="#ee9a3e" clip-path="url(#lx-h2)"/>
    <rect x="8" y="46" width="60" height="4.5" rx="2.25" fill="#1b3a5c"/>
    <rect x="18" y="56" width="40" height="4.5" rx="2.25" fill="#12808f" opacity="0.85"/>
    <rect x="28" y="66" width="20" height="4.5" rx="2.25" fill="#12808f" opacity="0.5"/>
  </g>
  <!-- Navy wordmark with a turquoise second half, echoing the navy LUXSEA over
       turquoise MIAMI in the full badge. Outlined so the file stands alone. -->
  <text x="92" y="62" font-family="Gambetta, 'Iowan Old Style', Georgia, serif" font-size="52" font-weight="700"
        letter-spacing="-1.8" fill="#1b3a5c">LUX<tspan fill="#12808f">SEA</tspan></text>
</svg>
