<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LuxSea Miami mark: an amber sun setting into turquoise water">
  <title>LuxSea Miami</title>
  <defs>
    <clipPath id="lx-horizon"><rect x="0" y="0" width="64" height="37"/></clipPath>
  </defs>
  <!-- The full badge is unreadable at 34px, so the header carries the two
       elements of it that survive: the sun and the water. -->
  <circle cx="32" cy="27" r="16" fill="#ee9a3e" clip-path="url(#lx-horizon)"/>
  <rect x="4" y="39" width="56" height="4" rx="2" fill="#1b3a5c"/>
  <rect x="13" y="48" width="38" height="4" rx="2" fill="#12808f" opacity="0.85"/>
  <rect x="23" y="57" width="18" height="4" rx="2" fill="#12808f" opacity="0.5"/>
</svg>
